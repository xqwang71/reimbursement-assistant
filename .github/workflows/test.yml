name: Mac and Windows

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements.txt 'PyMuPDF>=1.24,<2'
      - run: npx playwright install --only-shell chromium
      - run: npm run check
      - run: npm test
        env:
          CI: 'true'
          REIMBURSEMENT_PYTHON: python
